<svg width="1100" height="260" viewBox="0 0 1100 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roles-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#0E1626" />
    </linearGradient>

    <!-- Role Gradients -->
    <linearGradient id="role-cust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="role-kitch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="role-rider" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="role-admin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
  </defs>

  <rect width="1100" height="260" rx="20" fill="url(#roles-bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 26)">
    <text x="0" y="16" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" letter-spacing="1">
      👥 4-PILLAR MULTI-ROLE ENTERPRISE ECOSYSTEM
    </text>
    <text x="440" y="16" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Role-Based Access Control • Granular Data Permissions • Dedicated Portal Surfaces
    </text>
  </g>

  <!-- 4 ROLE CARDS -->
  <!-- Card 1: Customer -->
  <g transform="translate(40, 62)">
    <rect width="235" height="168" rx="14" fill="#0F172A" stroke="#0284C7" stroke-width="1.5" />
    <circle cx="36" cy="36" r="18" fill="url(#role-cust)" />
    <text x="27" y="42" font-size="16">👤</text>
    <text x="64" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Customer</text>
    <rect x="64" y="40" width="70" height="16" rx="8" fill="#0284C7" fill-opacity="0.2" />
    <text x="74" y="52" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">MOBILE APP</text>

    <line x1="18" y1="70" x2="215" y2="70" stroke="#1E293B" stroke-width="1" />

    <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Plan booking (7d / 30d)</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Meal preference (Veg/Jain)</text>
    <text x="18" y="126" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Pause / Skip meal delivery</text>
    <text x="18" y="144" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">★ Live GPS + OTP Handover</text>
  </g>

  <!-- Card 2: Kitchen Partner -->
  <g transform="translate(300, 62)">
    <rect width="235" height="168" rx="14" fill="#0F172A" stroke="#D97706" stroke-width="1.5" />
    <circle cx="36" cy="36" r="18" fill="url(#role-kitch)" />
    <text x="27" y="42" font-size="16">🍳</text>
    <text x="64" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Kitchen Partner</text>
    <rect x="64" y="40" width="80" height="16" rx="8" fill="#D97706" fill-opacity="0.2" />
    <text x="72" y="52" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">KITCHEN WEB</text>

    <line x1="18" y1="70" x2="215" y2="70" stroke="#1E293B" stroke-width="1" />

    <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Automated prep sheets</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• FSSAI compliance verification</text>
    <text x="18" y="126" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Daily capacity control</text>
    <text x="18" y="144" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">★ Batch Packing Checklist</text>
  </g>

  <!-- Card 3: Delivery Rider -->
  <g transform="translate(560, 62)">
    <rect width="235" height="168" rx="14" fill="#0F172A" stroke="#059669" stroke-width="1.5" />
    <circle cx="36" cy="36" r="18" fill="url(#role-rider)" />
    <text x="27" y="42" font-size="16">🛵</text>
    <text x="64" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Fleet Rider</text>
    <rect x="64" y="40" width="70" height="16" rx="8" fill="#059669" fill-opacity="0.2" />
    <text x="73" y="52" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">RIDER APP</text>

    <line x1="18" y1="70" x2="215" y2="70" stroke="#1E293B" stroke-width="1" />

    <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Geo route waypoints</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Transit status transition</text>
    <text x="18" y="126" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Real-time GPS stream</text>
    <text x="18" y="144" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">★ Proof-of-Delivery OTP</text>
  </g>

  <!-- Card 4: Operations Admin -->
  <g transform="translate(820, 62)">
    <rect width="240" height="168" rx="14" fill="#0F172A" stroke="#7E22CE" stroke-width="1.5" />
    <circle cx="36" cy="36" r="18" fill="url(#role-admin)" />
    <text x="27" y="42" font-size="16">🛡️</text>
    <text x="64" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Central Admin</text>
    <rect x="64" y="40" width="85" height="16" rx="8" fill="#7E22CE" fill-opacity="0.2" />
    <text x="72" y="52" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">CONTROL ROOM</text>

    <line x1="18" y1="70" x2="220" y2="70" stroke="#1E293B" stroke-width="1" />

    <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Global telemetry &amp; KPIs</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Multi-role CRUD &amp; filter</text>
    <text x="18" y="126" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">• Payment &amp; route simulation</text>
    <text x="18" y="144" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">★ Full System Governance</text>
  </g>
</svg>
