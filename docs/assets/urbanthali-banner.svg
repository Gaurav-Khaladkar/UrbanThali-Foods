<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="40%" stop-color="#0B132B" />
      <stop offset="70%" stop-color="#0D1B2A" />
      <stop offset="100%" stop-color="#100E24" />
    </linearGradient>

    <!-- Vibrant Neon Accent Gradients -->
    <linearGradient id="neon-flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00" />
      <stop offset="50%" stop-color="#FF5400" />
      <stop offset="100%" stop-color="#FF0054" />
    </linearGradient>
    <linearGradient id="neon-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#00A86B" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F59B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45" result="blur" />
    </filter>
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1200" height="420" rx="24" fill="url(#bg)" />

  <!-- Background Ambient Glows -->
  <circle cx="160" cy="90" r="160" fill="#FF5400" opacity="0.18" filter="url(#glow-ambient)" />
  <circle cx="1080" cy="180" r="180" fill="#00F0FF" opacity="0.15" filter="url(#glow-ambient)" />
  <circle cx="620" cy="380" r="140" fill="#00F59B" opacity="0.12" filter="url(#glow-ambient)" />
  <circle cx="850" cy="80" r="120" fill="#8B5CF6" opacity="0.12" filter="url(#glow-ambient)" />

  <!-- Cybernetic Grid Overlay -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="220" y1="0" x2="220" y2="420" />
    <line x1="340" y1="0" x2="340" y2="420" />
    <line x1="460" y1="0" x2="460" y2="420" />
    <line x1="580" y1="0" x2="580" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="820" y1="0" x2="820" y2="420" />
    <line x1="940" y1="0" x2="940" y2="420" />
    <line x1="1060" y1="0" x2="1060" y2="420" />
  </g>

  <!-- Border Gradient Stroke -->
  <rect x="1.5" y="1.5" width="1197" height="417" rx="22.5" stroke="url(#border-glow)" stroke-width="1.8" />

  <!-- LEFT HERO SECTION -->
  <g transform="translate(60, 54)">
    <!-- Animated LIVE Telemetry Pill -->
    <g>
      <rect width="210" height="32" rx="16" fill="#0F2D1F" stroke="#00F59B" stroke-width="1.2" />
      
      <!-- Pulsing Radar Beacon (SMIL Animation) -->
      <circle cx="20" cy="16" r="4.5" fill="#00F59B">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0.6;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="20" cy="16" r="5" fill="none" stroke="#00F59B" stroke-width="1.5">
        <animate attributeName="r" values="5;13" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite" />
      </circle>

      <text x="36" y="21" fill="#00F59B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.5">
        ● SYSTEM LIVE
      </text>
      <text x="135" y="21" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">
        v0.1.0 PRO
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="86" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
      UrbanThali <tspan fill="url(#neon-flame)">Foods</tspan>
    </text>

    <!-- Subtitles -->
    <text x="0" y="126" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="600">
      Subscription-First Cloud Kitchen, Fleet Dispatch &amp; Operations Monorepo
    </text>
    <text x="0" y="152" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">
      Cross-Platform Mobile (Expo) • Operations Portal (React 18) • TypeScript API • PostgreSQL &amp; Redis
    </text>

    <!-- Interactive Colorful Feature Pills -->
    <g transform="translate(0, 186)">
      <!-- Pill 1: Mobile -->
      <g>
        <rect x="0" y="0" width="145" height="34" rx="10" fill="#0C4A6E" fill-opacity="0.5" stroke="#0284C7" stroke-width="1.2" />
        <circle cx="16" cy="17" r="4.5" fill="#38BDF8" />
        <text x="28" y="22" fill="#BAE6FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">📱 Expo Mobile</text>
      </g>

      <!-- Pill 2: Admin -->
      <g transform="translate(155, 0)">
        <rect x="0" y="0" width="150" height="34" rx="10" fill="#064E3B" fill-opacity="0.5" stroke="#059669" stroke-width="1.2" />
        <circle cx="16" cy="17" r="4.5" fill="#34D399" />
        <text x="28" y="22" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">💻 Vite Admin Ops</text>
      </g>

      <!-- Pill 3: API -->
      <g transform="translate(315, 0)">
        <rect x="0" y="0" width="145" height="34" rx="10" fill="#451A03" fill-opacity="0.5" stroke="#D97706" stroke-width="1.2" />
        <circle cx="16" cy="17" r="4.5" fill="#FBBF24" />
        <text x="28" y="22" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">🚀 Express TS API</text>
      </g>

      <!-- Pill 4: DB & Redis -->
      <g transform="translate(470, 0)">
        <rect x="0" y="0" width="165" height="34" rx="10" fill="#3B0764" fill-opacity="0.5" stroke="#9333EA" stroke-width="1.2" />
        <circle cx="16" cy="17" r="4.5" fill="#C084FC" />
        <text x="28" y="22" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">⚡ Postgres + Redis</text>
      </g>
    </g>

    <!-- Metrics Row -->
    <g transform="translate(0, 252)">
      <line x1="0" y1="0" x2="635" y2="0" stroke="#334155" stroke-width="1" opacity="0.6" />
      
      <g transform="translate(0, 18)">
        <text x="0" y="16" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900">4 Roles</text>
        <text x="0" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Customer | Kitchen | Rider | Admin</text>
      </g>

      <g transform="translate(210, 18)">
        <text x="0" y="16" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900">Live GPS</text>
        <text x="0" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Waypoint Routing &amp; Live ETA</text>
      </g>

      <g transform="translate(430, 18)">
        <text x="0" y="16" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900">Multi-Gateway</text>
        <text x="0" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Razorpay &amp; Stripe Subscriptions</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SECTION: LIVE GRAPHICAL CARDS -->
  <!-- Card 1: Live Dispatch Control Telemetry Card -->
  <g transform="translate(740, 44)" filter="url(#shadow-lg)">
    <!-- Card Frame -->
    <rect width="400" height="165" rx="18" fill="url(#card-glass)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Card Header -->
    <circle cx="28" cy="28" r="10" fill="#0284C7" fill-opacity="0.25" />
    <circle cx="28" cy="28" r="4.5" fill="#38BDF8">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="48" y="33" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">
      LIVE FLEET DISPATCH
    </text>
    
    <!-- Status Tag -->
    <rect x="295" y="18" width="85" height="22" rx="11" fill="#065F46" stroke="#10B981" stroke-width="1" />
    <text x="310" y="33" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800">
      ● IN TRANSIT
    </text>

    <!-- Animated Route Line with Moving Rider Pulse -->
    <g transform="translate(25, 68)">
      <path d="M 10 15 Q 90 -10, 175 15 T 340 10" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" />
      
      <!-- Start Hub -->
      <circle cx="10" cy="15" r="6" fill="#F59E0B" />
      <text x="0" y="32" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">HUB</text>

      <!-- Active Rider Marker (Animated Pulsing Glow) -->
      <circle cx="175" cy="15" r="8" fill="#00F0FF">
        <animate attributeName="r" values="7;10;7" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="175" cy="15" r="14" fill="none" stroke="#00F0FF" stroke-width="1.5">
        <animate attributeName="r" values="8;18" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0" dur="1.5s" repeatCount="indefinite" />
      </circle>

      <!-- Destination -->
      <circle cx="340" cy="10" r="6" fill="#10B981" />
      <text x="315" y="28" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">CUSTOMER</text>
    </g>

    <!-- Telemetry Info Bar -->
    <rect x="20" y="108" width="360" height="42" rx="10" fill="#091122" fill-opacity="0.9" stroke="#1E293B" stroke-width="1" />
    <text x="34" y="133" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Rider: <tspan fill="#F8FAFC" font-weight="700">Rahul Patil (EV-12)</tspan></text>
    <text x="210" y="133" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ETA: <tspan fill="#00F59B" font-weight="800">12 Mins</tspan></text>
    <text x="290" y="133" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Speed: <tspan fill="#38BDF8" font-weight="700">32 km/h</tspan></text>
  </g>

  <!-- Card 2: Live Kitchen Manifest & Subscriptions Card -->
  <g transform="translate(740, 226)" filter="url(#shadow-lg)">
    <!-- Card Frame -->
    <rect width="400" height="152" rx="18" fill="url(#card-glass)" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Card Header -->
    <circle cx="28" cy="26" r="10" fill="#D97706" fill-opacity="0.25" />
    <circle cx="28" cy="26" r="4.5" fill="#F59E0B">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="48" y="31" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">
      KITCHEN PREP MANIFEST
    </text>
    <text x="310" y="31" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">
      Lunch Slot (2,840)
    </text>

    <!-- Colored Distribution Bars -->
    <g transform="translate(24, 46)">
      <!-- Veg Bar -->
      <text x="0" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Veg Thali (1,647)</text>
      <text x="300" y="14" fill="#00F59B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">58%</text>
      <rect x="0" y="20" width="350" height="8" rx="4" fill="#1E293B" />
      <rect x="0" y="20" width="203" height="8" rx="4" fill="url(#neon-emerald)" />

      <!-- Non-Veg Bar -->
      <text x="0" y="46" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Special Non-Veg (852)</text>
      <text x="300" y="46" fill="#FF5400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">30%</text>
      <rect x="0" y="52" width="350" height="8" rx="4" fill="#1E293B" />
      <rect x="0" y="52" width="105" height="8" rx="4" fill="url(#neon-flame)" />

      <!-- Jain & Keto Bar -->
      <text x="0" y="78" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Jain / Keto (341)</text>
      <text x="300" y="78" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">12%</text>
      <rect x="0" y="84" width="350" height="8" rx="4" fill="#1E293B" />
      <rect x="0" y="84" width="42" height="8" rx="4" fill="url(#neon-cyan)" />
    </g>
  </g>
</svg>
