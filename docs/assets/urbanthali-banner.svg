<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Brand Accent Gradients -->
    <linearGradient id="amber-flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="36" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="20" fill="url(#bg-grad)" />

  <!-- Subtle Tech Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="440" y1="0" x2="440" y2="400" />
    <line x1="560" y1="0" x2="560" y2="400" />
    <line x1="680" y1="0" x2="680" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="920" y1="0" x2="920" y2="400" />
    <line x1="1040" y1="0" x2="1040" y2="400" />
    <line x1="1160" y1="0" x2="1160" y2="400" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="140" fill="#F59E0B" opacity="0.12" filter="url(#glow-amber)" />
  <circle cx="1080" cy="180" r="160" fill="#3B82F6" opacity="0.1" filter="url(#glow-amber)" />
  <circle cx="600" cy="360" r="120" fill="#10B981" opacity="0.08" filter="url(#glow-amber)" />

  <!-- Outer Border Stroke -->
  <rect x="1" y="1" width="1198" height="398" rx="19" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5" />

  <!-- LEFT HERO SECTION: Brand & Title -->
  <g transform="translate(60, 60)">
    <!-- Brand Tag Pill -->
    <rect width="216" height="30" rx="15" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="15" cy="15" r="4.5" fill="#F59E0B" />
    <text x="28" y="19" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">ENTERPRISE TIFFIN OPS</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      UrbanThali <tspan fill="url(#amber-flame)">Foods</tspan>
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="118" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Subscription-First Cloud Kitchen, Fleet Dispatch &amp; Operations Monorepo
    </text>
    <text x="0" y="142" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">
      Production-ready microservice foundation powering Mobile, Web Admin, Kitchen &amp; Logistics
    </text>

    <!-- Tech Badges Pill Row -->
    <g transform="translate(0, 180)">
      <!-- Badge 1: Cross-Platform -->
      <rect x="0" y="0" width="145" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#38BDF8" />
      <text x="28" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Expo Mobile App</text>

      <!-- Badge 2: React Admin -->
      <rect x="155" y="0" width="145" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="171" cy="16" r="4" fill="#10B981" />
      <text x="183" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Vite Admin Suite</text>

      <!-- Badge 3: Express API -->
      <rect x="310" y="0" width="145" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="326" cy="16" r="4" fill="#F59E0B" />
      <text x="338" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TypeScript API</text>

      <!-- Badge 4: Postgres & Redis -->
      <rect x="465" y="0" width="160" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="481" cy="16" r="4" fill="#A855F7" />
      <text x="493" y="20" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PostgreSQL + Redis</text>
    </g>

    <!-- Metrics Stat Bar -->
    <g transform="translate(0, 245)">
      <line x1="0" y1="0" x2="625" y2="0" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
      
      <text x="0" y="24" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">4 Core Roles</text>
      <text x="0" y="40" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Customer | Kitchen | Rider | Admin</text>

      <text x="210" y="24" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Real-Time GPS</text>
      <text x="210" y="40" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ETA &amp; Waypoint Sequencing</text>

      <text x="420" y="24" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Multi-Gateway</text>
      <text x="420" y="40" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Razorpay + Stripe Subscriptions</text>
    </g>
  </g>

  <!-- RIGHT SECTION: Interactive Glass Cards Visualization -->
  <!-- Card 1: Dispatch Control Room Card (Top Right) -->
  <g transform="translate(750, 48)" filter="url(#card-shadow)">
    <rect width="390" height="155" rx="16" fill="url(#card-surface)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Header -->
    <circle cx="28" cy="28" r="10" fill="#10B981" fill-opacity="0.15" />
    <circle cx="28" cy="28" r="4.5" fill="#10B981" />
    <text x="48" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">LIVE FLEET DISPATCH</text>
    <rect x="290" y="18" width="76" height="20" rx="10" fill="#10B981" fill-opacity="0.15" />
    <text x="302" y="32" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">IN TRANSIT</text>

    <!-- Route graphic mini -->
    <path d="M 30 75 Q 110 55, 190 75 T 350 65" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" />
    <!-- Start & End Markers -->
    <circle cx="30" cy="75" r="5" fill="#F59E0B" />
    <circle cx="190" cy="75" r="7" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="350" cy="65" r="5" fill="#10B981" />

    <!-- Info Row -->
    <rect x="20" y="100" width="350" height="40" rx="8" fill="#0B132B" fill-opacity="0.7" />
    <text x="32" y="125" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Rider: <tspan fill="#F1F5F9" font-weight="600">Rahul Patil</tspan></text>
    <text x="160" y="125" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ETA: <tspan fill="#34D399" font-weight="700">12 Mins</tspan></text>
    <text x="260" y="125" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Order: <tspan fill="#F59E0B" font-weight="600">#UT-7842</tspan></text>
  </g>

  <!-- Card 2: Kitchen & Subscription Manifest (Bottom Right) -->
  <g transform="translate(750, 222)" filter="url(#card-shadow)">
    <rect width="390" height="135" rx="16" fill="url(#card-surface)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Header -->
    <circle cx="28" cy="26" r="10" fill="#F59E0B" fill-opacity="0.15" />
    <circle cx="28" cy="26" r="4.5" fill="#F59E0B" />
    <text x="48" y="30" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">KITCHEN PREP MANIFEST</text>
    <text x="300" y="30" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Lunch Slot</text>

    <!-- Bars / Meal Types distribution -->
    <g transform="translate(24, 48)">
      <!-- Veg Bar -->
      <text x="0" y="12" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Veg Thali (58%)</text>
      <rect x="110" y="3" width="225" height="10" rx="5" fill="#1E293B" />
      <rect x="110" y="3" width="130" height="10" rx="5" fill="#10B981" />

      <!-- Non-Veg Bar -->
      <text x="0" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Special (30%)</text>
      <rect x="110" y="25" width="225" height="10" rx="5" fill="#1E293B" />
      <rect x="110" y="25" width="68" height="10" rx="5" fill="#EA580C" />

      <!-- Jain / Keto Bar -->
      <text x="0" y="56" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Keto / Jain (12%)</text>
      <rect x="110" y="47" width="225" height="10" rx="5" fill="#1E293B" />
      <rect x="110" y="47" width="27" height="10" rx="5" fill="#38BDF8" />
    </g>
  </g>
</svg>
