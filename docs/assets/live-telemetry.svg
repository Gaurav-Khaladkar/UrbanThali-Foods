<svg width="1100" height="340" viewBox="0 0 1100 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D" />
      <stop offset="50%" stop-color="#0D1527" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <filter id="lt-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="340" rx="20" fill="url(#lt-bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Live Status Header Bar -->
  <g transform="translate(40, 30)">
    <!-- Pulsing Live Dot -->
    <circle cx="12" cy="12" r="5" fill="#00F59B">
      <animate attributeName="r" values="4;6.5;4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="12" cy="12" r="6" fill="none" stroke="#00F59B" stroke-width="1.5">
      <animate attributeName="r" values="5;14" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <text x="32" y="17" fill="#00F59B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" letter-spacing="1.5">
      LIVE TELEMETRY STREAM
    </text>
    <text x="240" y="17" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Real-Time Cloud Kitchen, Fleet Dispatch &amp; Subscription Gateway Metrics
    </text>
    <rect x="910" y="0" width="110" height="26" rx="13" fill="#0F2D1F" stroke="#00F59B" stroke-width="1" />
    <text x="926" y="17" fill="#00F59B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">
      99.98% UPTIME
    </text>
  </g>

  <!-- 4 LIVE KPI METRIC CARDS -->
  <g transform="translate(40, 75)">
    <!-- KPI 1: Active Subscriptions -->
    <g transform="translate(0, 0)">
      <rect width="235" height="120" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <rect x="18" y="16" width="34" height="34" rx="8" fill="#F59E0B" fill-opacity="0.15" />
      <text x="26" y="38" font-size="18">📅</text>
      <text x="62" y="30" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Active Subscriptions</text>
      <text x="62" y="45" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">▲ +14.2% This Month</text>
      
      <text x="18" y="92" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900">1,428</text>
      <text x="105" y="92" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Recurring Plans</text>
      <line x1="18" y1="108" x2="215" y2="108" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- KPI 2: Kitchen Daily Prep -->
    <g transform="translate(260, 0)">
      <rect width="235" height="120" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <rect x="18" y="16" width="34" height="34" rx="8" fill="#10B981" fill-opacity="0.15" />
      <text x="26" y="38" font-size="18">🍳</text>
      <text x="62" y="30" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Daily Kitchen Prep</text>
      <text x="62" y="45" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">● 98.4% Dispatched</text>
      
      <text x="18" y="92" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900">2,840</text>
      <text x="105" y="92" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Thalis Cooked</text>
      <line x1="18" y1="108" x2="215" y2="108" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- KPI 3: Fleet in Transit -->
    <g transform="translate(520, 0)">
      <rect width="235" height="120" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <rect x="18" y="16" width="34" height="34" rx="8" fill="#38BDF8" fill-opacity="0.15" />
      <text x="26" y="38" font-size="18">🛵</text>
      <text x="62" y="30" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Active Delivery Fleet</text>
      <text x="62" y="45" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">● 34 Live in Transit</text>
      
      <text x="18" y="92" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900">48</text>
      <text x="62" y="92" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">On-Duty Riders</text>
      <line x1="18" y1="108" x2="215" y2="108" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- KPI 4: On-Time SLA -->
    <g transform="translate(780, 0)">
      <rect width="240" height="120" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <rect x="18" y="16" width="34" height="34" rx="8" fill="#A855F7" fill-opacity="0.15" />
      <text x="26" y="38" font-size="18">⚡</text>
      <text x="62" y="30" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">On-Time Delivery SLA</text>
      <text x="62" y="45" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">★ Benchmark: &gt;98%</text>
      
      <text x="18" y="92" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900">99.4%</text>
      <text x="110" y="92" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Avg ETA: 18 min</text>
      <line x1="18" y1="108" x2="220" y2="108" stroke="#A855F7" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- LIVE SYSTEM SERVICES HEALTH BAR -->
  <g transform="translate(40, 220)">
    <rect width="1020" height="85" rx="14" fill="#0B132B" stroke="#1E293B" stroke-width="1.2" />
    
    <text x="24" y="32" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">
      MICROSERVICES &amp; CLOUD HEALTH STATUS
    </text>

    <!-- 5 Component Health Badges -->
    <g transform="translate(24, 44)">
      <!-- 1. Express API -->
      <g>
        <rect width="180" height="28" rx="7" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#00F59B">
          <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
        </circle>
        <text x="28" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Express API Gateway</text>
      </g>

      <!-- 2. PostgreSQL -->
      <g transform="translate(195, 0)">
        <rect width="180" height="28" rx="7" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#00F59B">
          <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" />
        </circle>
        <text x="28" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PostgreSQL Pool</text>
      </g>

      <!-- 3. Redis Cache -->
      <g transform="translate(390, 0)">
        <rect width="180" height="28" rx="7" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#00F59B">
          <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
        </circle>
        <text x="28" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Redis Cache &amp; PubSub</text>
      </g>

      <!-- 4. BullMQ / SQS -->
      <g transform="translate(585, 0)">
        <rect width="185" height="28" rx="7" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#00F59B">
          <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite" />
        </circle>
        <text x="28" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">BullMQ Batch Workers</text>
      </g>

      <!-- 5. AWS CloudFront & S3 -->
      <g transform="translate(785, 0)">
        <rect width="185" height="28" rx="7" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="14" r="4" fill="#00F59B">
          <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite" />
        </circle>
        <text x="28" y="18" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">AWS CDN &amp; S3 Storage</text>
      </g>
    </g>
  </g>
</svg>
